<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sumith Live Feed Demo</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; }
  label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
  input, select { width: 100%; padding: 0.4rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; }
  #status { margin-top: 0.75rem; font-size: 0.85rem; color: #444; }
  iframe { width: 100%; height: 480px; margin-top: 1rem; border: 1px solid #ccc; display: none; }
</style>
</head>
<body>
  <h2>Sumith Live Feed</h2>

  <label>Username <input id="username" value="nishant.dhaktod@sumith.in"></label>
  <label>Password <input id="password" type="password" value="Login@123"></label>

  <button onclick="loadPlates()">List vehicles</button>
  <label>Plate <select id="plateNo"></select></label>

  <label>Channel ID <input id="channelId" value="1"></label>
  <label>Project ID <input id="projectId" value="37"></label>

  <button onclick="showFeed()">Show live feed</button>

  <div id="status"></div>
  <iframe id="feed"></iframe>

  <script>
    const API = "http://localhost:4000";

    async function loadPlates() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");
      status.textContent = "Loading vehicles...";
      try {
        const res = await fetch(`${API}/api/bridge/sumithlive/vehicles?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
        const vehicles = await res.json();
        const select = document.getElementById("plateNo");
        select.innerHTML = vehicles.map(v => `<option value="${v.plate_no}">${v.plate_no}</option>`).join("");
        status.textContent = `Loaded ${vehicles.length} vehicles.`;
      } catch (e) {
        status.textContent = "Error loading vehicles: " + e;
      }
    }

    async function showFeed() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const plateNo = document.getElementById("plateNo").value;
      const channelId = parseInt(document.getElementById("channelId").value, 10);
      const projectId = parseInt(document.getElementById("projectId").value, 10);
      const status = document.getElementById("status");
      const iframe = document.getElementById("feed");

      status.textContent = "Requesting stream link...";
      try {
        const res = await fetch(`${API}/api/bridge/sumithlive/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, plateNo, channelId, projectId }),
        });
        if (!res.ok) throw new Error(await res.text());
        const { jspLink } = await res.json();
        status.textContent = "jspLink: " + jspLink;
        iframe.src = jspLink;
        iframe.style.display = "block";
      } catch (e) {
        status.textContent = "Error: " + e;
        iframe.style.display = "none";
      }
    }
  </script>
</body>
</html>
