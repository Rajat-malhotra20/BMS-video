apiVersion: v1
kind: Namespace
metadata:
  name: bms-dev

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: bms-dev
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]

    rtspAddress: :8554
    rtmpAddress: :1935
    hlsAddress: :8888
    webrtcAddress: :8889
    apiAddress: :9997
    api: yes
    playback: yes
    playbackAddress: :9996

    protocols: [tcp, udp]
    readTimeout: 10s
    writeTimeout: 10s
    webrtcICEServers2: []

    # Overridden at runtime via MTX_WEBRTCADDITIONALHOSTS / MTX_WEBRTCLOCALUDPADDRESS
    # env vars on the Deployment below — keep in sync with the bms-ingest
    # Service's UDP nodePort.
    webrtcAdditionalHosts: [127.0.0.1]
    webrtcLocalUDPAddress: :18189

    hlsAlwaysRemux: yes
    hlsVariant: fmp4
    hlsSegmentCount: 7
    hlsSegmentDuration: 1s
    hlsPartDuration: 200ms

    # Allow anonymous publish and read for dev. Lock this down before this
    # is reachable from the public internet — see REMOTE_BUSES_SETUP.md.
    authMethod: internal
    authInternalUsers:
      - user: any
        pass:
        ips: []
        permissions:
          - action: publish
            path:
          - action: read
            path:
          - action: playback
            path:
          - action: api
          - action: metrics

    pathDefaults:
      # No local recording: clips/evidence are fetched from the vendor APIs,
      # so there is no volume to write to. This makes GET /api/buses/{id}/recording
      # return playback URLs with nothing behind them.
      record: no

    paths:
      all_others:
        source: publisher

---
# Vendor-less bridge config (see prototype/backend/config/*.json.example).
# vendors.json's passwords are deliberately left empty here — they come
# from the separate vendor-credentials ConfigMap instead, via
# VENDOR_<NAME>_PASSWORD env vars (config/vendors.go fills a blank
# password from that env var). Edit buses.json here to add/reassign a bus; no image rebuild
# needed, just `kubectl apply` + a rollout restart (mounted config, same
# as mediamtx.yml below).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vendors-config
  namespace: bms-dev
data:
  vendors.json: |
    {
      "castmaster": { "baseUrl": "https://cmmipl.org:22056", "username": "admin", "password": "" },
      "sumithlive": { "baseUrl": "https://trakzee2.uffizio.com", "username": "vishvam@Login.com", "password": "", "extra": { "projectId": "37" } },
      "chemitoapi": { "baseUrl": "http://15.252.130.159:12056", "username": "admin", "password": "" }
    }
  buses.json: |
    {
      "GJ03BZ0327": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03BZ0327", "projectId": "37" } },
      "GJ03BZ2174": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03BZ2174", "projectId": "37" } },
      "GJ03BZ2388": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03BZ2388", "projectId": "37" } },
      "GJ03BZ4198": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03BZ4198", "projectId": "37" } },
      "GJ03BZ4392": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03BZ4392", "projectId": "37" } },
      "GJ03CU0096": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03CU0096", "projectId": "37" } },
      "GJ03CU0206": { "vendor": "sumithlive", "vendorParams": { "plateNo": "GJ03CU0206", "projectId": "37" } },
      "DLPD8611": { "vendor": "chemitoapi", "vendorParams": { "terid": "00C400403F" } }
    }

---
# vendor-credentials (the passwords) is NOT defined here on purpose — same
# reasoning as ecr-pull-secret: real credential values must never live in a
# file that gets `kubectl apply`'d repeatedly, or the next apply resets them
# to whatever placeholder is committed. Create it once, out-of-band, with
# keys castmaster-password / sumithlive-password / chemitoapi-password —
# see DEPLOY.md. The configMapKeyRefs below are optional, so the pod starts
# without it; a vendor whose password is missing just can't authenticate.

---
# Single container: MediaMTX + Go API run together (supervisord). Backend reaches
# MediaMTX over localhost, so there is no internal Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-video
  namespace: bms-dev
spec:
  replicas: 1
  strategy:
    type: Recreate   # never run 2 pods at once — both would publish to livefeed
  selector:
    matchLabels:
      app: bms-video
  template:
    metadata:
      labels:
        app: bms-video
    spec:
      # ip-172-31-4-81 has no outbound internet (egress-dead) — vendor calls to
      # trakzee2.uffizio.com get TCP RST there. Keep this pod off that node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - "ip-172-31-4-81"
      # Image is pulled from ECR. ecr-pull-secret is the namespace's
      # maintained registry credential — the other bms-dev deployments use
      # it too, so it stays refreshed. See DEPLOY.md.
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: bms-video
          image: 475560691356.dkr.ecr.ap-south-1.amazonaws.com/bms/video/dev:latest
          imagePullPolicy: Always
          env:
            # Domain buses/clients use to reach this pod — must match the DNS
            # record pointed at the node(s) fronting the bms-ingest Service.
            - name: MTX_WEBRTCADDITIONALHOSTS
              value: "bms-media.gna.energy"
            # Must equal the UDP port+nodePort on bms-ingest below, otherwise
            # WebRTC ICE candidates advertise an unreachable port.
            - name: MTX_WEBRTCLOCALUDPADDRESS
              value: ":30189"
            # CORS for the JSON API. "*" is a placeholder — pin this to the
            # real frontend origin before this is reachable from production.
            - name: CORS_ALLOWED_ORIGIN
              value: "*"
            # supervisord sets no working directory for the backend program,
            # so the relative "config/vendors.json" default wouldn't resolve
            # — pin absolute paths matching the vendor-config volume below.
            - name: VENDORS_CONFIG
              value: "/config/vendors.json"
            - name: BUSES_CONFIG
              value: "/config/buses.json"
            # Passwords only — the rest of each vendor's config comes from
            # the vendors-config ConfigMap (mounted below); this fills in
            # the blank "password" field config/vendors.go leaves for env
            # override. optional: true because vendors.go reads these with
            # os.Getenv and skips an unset one, so a missing key just leaves
            # that vendor's bridge unusable instead of stopping the pod.
            - name: VENDOR_CASTMASTER_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: vendor-credentials
                  key: castmaster-password
                  optional: true
            - name: VENDOR_SUMITHLIVE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: vendor-credentials
                  key: sumithlive-password
                  optional: true
            - name: VENDOR_CHEMITOAPI_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: vendor-credentials
                  key: chemitoapi-password
                  optional: true
          ports:
            - containerPort: 8080
              protocol: TCP   # Go JSON API (the one API)
            - containerPort: 1935
              protocol: TCP   # RTMP ingest
            - containerPort: 30189
              protocol: UDP   # WebRTC media
            - containerPort: 9500
              protocol: TCP   # N9M device signaling
            - containerPort: 9501
              protocol: TCP   # N9M device media
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
            - name: vendor-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 320Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
        - name: vendor-config
          configMap:
            name: vendors-config

---
# The one API — HLS/WebRTC/playback/mtx-api all proxied through here on :8080.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bms-dev
spec:
  type: NodePort
  selector:
    app: bms-video
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

---
# Public ingest surface — buses publish RTMP here directly, WebRTC media (UDP)
# flows here directly. Raw TCP/UDP, cannot go through an HTTP Ingress.
apiVersion: v1
kind: Service
metadata:
  name: bms-ingest
  namespace: bms-dev
spec:
  type: NodePort
  selector:
    app: bms-video
  ports:
    - name: rtmp
      port: 1935
      targetPort: 1935
      nodePort: 31935
      protocol: TCP
    - name: webrtc-media
      port: 30189
      targetPort: 30189
      nodePort: 30189   # must equal MTX_WEBRTCLOCALUDPADDRESS port — do not remap
      protocol: UDP
    - name: n9m-signal
      port: 9500
      targetPort: 9500
      nodePort: 30500
      protocol: TCP
    - name: n9m-media
      port: 9501
      targetPort: 9501
      nodePort: 30501
      protocol: TCP
