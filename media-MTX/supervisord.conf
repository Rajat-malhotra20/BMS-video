[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=app

# MediaMTX media server — RTMP/RTSP/HLS/WebRTC ingest + playback + recording.
[program:mediamtx]
command=/usr/local/bin/mediamtx /mediamtx.yml
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# media-mtxd — the raw-packet service: owns the ffmpeg remux supervisor, the
# N9M device listeners (:9500/:9501), and the vendors that can only be
# delivered by remuxing into MediaMTX (n9m, castmaster). Starts after
# MediaMTX because every job it runs publishes into it, and before the
# backend because the backend asks it what is ingesting.
[program:media-mtxd]
command=/usr/local/bin/media-mtxd
environment=VENDORS_CONFIG="/config/vendors.json",MEDIAMTX_API="http://127.0.0.1:9997/v3",MEDIAMTX_RTSP="rtsp://127.0.0.1:8554"
autorestart=true
startsecs=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Go JSON API — the fleet API the frontend talks to. Holds no MediaMTX
# knowledge: it reaches media-mtxd over localhost for anything raw-packet,
# and serves Chemito (HTTP-FLV) and Sumith (HLS/embed) itself, since those
# need no media server at all. The /live /whep /playback reverse proxies
# still point at MediaMTX directly — those are dumb byte pipes for playback,
# not API calls.
[program:backend]
command=/usr/local/bin/mediamtx-console
environment=INGEST_URL="http://127.0.0.1:8090"
autorestart=true
startsecs=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
