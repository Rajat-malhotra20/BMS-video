logLevel: info
logDestinations: [stdout]

rtspAddress: :8554
rtmpAddress: :1935        # ← Larix RTMP ingest
hlsAddress: :8888
webrtcAddress: :8889      # WHIP ingest + WHEP playback
apiAddress: :9997
api: yes
playback: yes
playbackAddress: :9996

protocols: [tcp, udp]
readTimeout: 10s
writeTimeout: 10s
webrtcICEServers2: []

# WebRTC ICE: advertise reachable host(s) + fixed muxed UDP port so
# browsers can receive media from the Dockerised server.
# Override via MTX_WEBRTCADDITIONALHOSTS env var (e.g. ECS task public IP/DNS).
# Defaults to 127.0.0.1 for local dev.
webrtcAdditionalHosts: [127.0.0.1]
webrtcLocalUDPAddress: :18189

hlsAlwaysRemux: yes        # keep HLS segments flowing even with no active reader
hlsVariant: fmp4           # mpegts crashed reliably every 1-2min on Chemito's B-frame pattern ("too many reordered frames"); fmp4 confirmed crash-free
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# Allow anonymous publish and read for dev
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api        # allow /v3/paths/list (dashboard /cams discovery)
      - action: metrics

pathDefaults:
  # Recording disabled for now — matches production (evidence/clips are
  # fetched from vendor APIs instead). GET /api/stream/{id}/recording will
  # return playback URLs with nothing behind them until this is turned
  # back on.
  record: no

paths:
  all_others:
    source: publisher
