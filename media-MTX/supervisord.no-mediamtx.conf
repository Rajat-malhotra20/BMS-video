# Fleet API only: no MediaMTX, no media-mtxd, no ffmpeg.
#
# Valid because the vendors in use need no media server — Chemito serves
# HTTP-FLV (proxied straight to the browser, played by mpegts.js) and Sumith
# serves HLS or an embed page. Only n9m and castmaster need a remux, and
# with this config those buses simply do not appear.
#
# Select it with: docker compose -f docker-compose.yml -f docker-compose.no-mediamtx.yml up -d
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=app

[program:backend]
command=/usr/local/bin/mediamtx-console
# INGEST_URL empty = no ingest service is contacted at all, so there is no
# retry noise in the logs for something deliberately not running.
environment=INGEST_URL=""
autorestart=true
startsecs=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
